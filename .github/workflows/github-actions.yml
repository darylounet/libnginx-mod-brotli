name: Build and Deploy
on:
  push:
    tags:
      - '**'
jobs:
  Build-And-Deploy:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: ubuntu
            dist: jammy
            runner: ubuntu-24.04-arm
          - os: ubuntu
            dist: noble
            runner: ubuntu-24.04-arm
          - os: debian
            dist: bullseye
            runner: ubuntu-24.04-arm
          - os: debian
            dist: bookworm
            runner: ubuntu-24.04-arm
          - os: debian
            dist: trixie
            runner: ubuntu-24.04-arm
          - os: ubuntu
            dist: jammy
            runner: ubuntu-24.04
          - os: ubuntu
            dist: noble
            runner: ubuntu-24.04
          - os: debian
            dist: bullseye
            runner: ubuntu-24.04
          - os: debian
            dist: bookworm
            runner: ubuntu-24.04
          - os: debian
            dist: trixie
            runner: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Login to Docker Registry
        run: docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin <<< "$DOCKER_PASSWORD"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      - name: Launch build script
        env:
          OS: ${{ matrix.os }}
          DIST: ${{ matrix.dist }}
        run: |
          ./build.sh
      - name: Copy and prepare artifacts
        run: |
          mkdir -p build && \
          docker run build-nginx-brotli && \
          docker cp $(docker ps -l -q):/src build/ && \
          mv build/src/*.deb ./ && \
          rm -Rf build
      - name: Deploy to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./*.deb"
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
      - name: Deploy to packagecloud
        uses: golift/upload-packagecloud@v1.1
        with:
          userrepo: ${{ secrets.PACKAGECLOUD_USER }}/${{ secrets.PACKAGECLOUD_REPO }}
          debdists: ${{ matrix.os }}/${{ matrix.dist }}
          apitoken: ${{ secrets.PACKAGECLOUD_TOKEN }}
          packages: .
